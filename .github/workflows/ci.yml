name: CI

# 為什麼只有 push/PR:這個 repo 沒有 build 產物要發佈,CI 的職責只有一個 ——
# 讓「合進 main 的程式碼在乾淨 clone 上跑得過測試」。發佈到船隊仍走 SFTP 上傳,
# 與這裡無關。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    # 對齊船上 IPC1/IPC2 的 Jammy(22.04)**與 aarch64**。
    #
    # 架構不是可有可無的:deploy/platforms/*/debs 裡是 arm64 的 tmux,而
    # install_tmux_offline.sh 的 --check-only 會把它解包後**真的執行一次**做 ABI 探測。
    # 在 x86 runner 上那支 binary 根本跑不起來,rc 會是 6(ABI 不符)而不是 5(可安裝)——
    # 實測過,那是 x86 runner 上唯一紅的一項。輪子(wheelhouse)也同樣是 aarch64 的。
    #
    # Bionic(18.04)的相容性由 test_offline_deploy.py 的靜態掃描守門:GitHub 已經沒有
    # 18.04 runner,真機驗證仍在 Bionic 開發機上做。
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # 船端 venv 是 3.10.12;測試裡的 py3.6 守門是靜態掃描,不需要 3.6 直譯器。
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: 安裝相依
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: pytest
        # 乾淨 clone 上有 5 項會 skip:3 項要 share/scheduler(另一個 repo),
        # 2 項要離線輪子(*.whl 不納入版控)。兩者都在開發機上照常跑。
        run: python -m pytest -q

  shellcheck:
    # 與 pytest 分開跑:兩者互不相依,分開的話一眼看得出是「程式碼紅了」還是「腳本紅了」。
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: shellcheck
        # -x:跟進 source 進去的檔(script/_dev_guard.sh 才會被一起檢查)。
        # 檔案清單用 git ls-files,新增的 .sh 自動納入,不必回來改這裡。
        #
        # 版本:Jammy 的 apt 是 0.8.0。這份程式碼在 0.8.0 與 0.10.0 上都是零 findings,
        # 之後若因為升版冒出新規則而變紅,請照既有做法處理 —— 該修的修,故意的寫
        # `# shellcheck disable=SCxxxx  # 理由`,不要無理由地整批關掉。
        run: |
          command -v shellcheck >/dev/null 2>&1 \
            || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
          shellcheck --version
          git ls-files '*.sh' | xargs shellcheck -x

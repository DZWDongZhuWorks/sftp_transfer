name: CI

# 為什麼只有 push/PR:這個 repo 沒有 build 產物要發佈,CI 的職責只有一個 ——
# 讓「合進 main 的程式碼在乾淨 clone 上跑得過測試」。發佈到船隊仍走 SFTP 上傳,
# 與這裡無關。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    # 對齊船上 IPC1/IPC2 的 Jammy(22.04)**與 aarch64**。
    #
    # 架構不是可有可無的:deploy/platforms/*/debs 裡是 arm64 的 tmux,而
    # install_tmux_offline.sh 的 --check-only 會把它解包後**真的執行一次**做 ABI 探測。
    # 在 x86 runner 上那支 binary 根本跑不起來,rc 會是 6(ABI 不符)而不是 5(可安裝)——
    # 實測過,那是 x86 runner 上唯一紅的一項。輪子(wheelhouse)也同樣是 aarch64 的。
    #
    # Bionic(18.04)的相容性由 test_offline_deploy.py 的靜態掃描守門:GitHub 已經沒有
    # 18.04 runner,真機驗證仍在 Bionic 開發機上做。
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # 船端 venv 是 3.10.12;測試裡的 py3.6 守門是靜態掃描,不需要 3.6 直譯器。
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: 安裝相依
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: pytest
        # 乾淨 clone 上有 5 項會 skip:3 項要 share/scheduler(另一個 repo),
        # 2 項要離線輪子(*.whl 不納入版控)。兩者都在開發機上照常跑。
        run: python -m pytest -q
